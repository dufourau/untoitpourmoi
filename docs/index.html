<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un toit pour moi</title>
<meta name="description" content="Un toit pour moi : la galerie photo du projet. Soutenez-nous sur HelloAsso.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1c1b19;
    --stone: #373733;
    --ash: #928e84;
    --mist: #a7a59c;
    --bone: #d5d1c8;
    --ember: #c98a5e;   /* warm accent for the donate actions */
    --ember-hi: #dfa071;
    --slide-w: min(62vw, 980px);
    --slide-h: min(62vh, 620px);
    --gap: 28px;
  }
  @media (max-width: 760px) {
    :root { --slide-w: 84vw; --slide-h: 62vh; --gap: 14px; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--bone); overflow-x: hidden;
         font: 15px/1.6 "Karla", system-ui, sans-serif; letter-spacing: .01em; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  /* Blurred copy of the current photo behind everything */
  .backdrop { position: fixed; inset: -60px; z-index: 0; background: center/cover no-repeat var(--stone);
              filter: blur(38px) saturate(.8) brightness(.45); transform: scale(1.1);
              transition: background-image .6s ease; }
  .backdrop::after { content: ""; position: absolute; inset: 0;
                     background: radial-gradient(ellipse at center, transparent 30%, rgba(10,9,8,.7) 100%); }
  .page { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; }

  /* Top bar */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
           padding: 22px clamp(16px, 4vw, 48px); gap: 12px; }
  .logo { font-family: "Cormorant Garamond", serif; font-size: 1.6rem; font-weight: 600;
          text-decoration: none; color: var(--bone); white-space: nowrap; }
  .views { display: flex; gap: 4px; background: rgba(55,55,51,.6); padding: 4px; border-radius: 8px; }
  .views button { background: none; border: 0; padding: 6px 9px; border-radius: 6px; cursor: pointer;
                  color: var(--ash); display: grid; place-items: center; }
  .views button.on { background: var(--bone); color: var(--night); }
  .donate-link { justify-self: end; text-decoration: none; font-weight: 700; font-size: .78rem;
                 text-transform: uppercase; letter-spacing: .16em; color: var(--night);
                 background: var(--ember); padding: 10px 18px; border-radius: 999px; transition: background .2s; }
  .donate-link:hover { background: var(--ember-hi); }
  .donate-link { white-space: nowrap; }
  @media (max-width: 560px) {
    header { padding: 16px; gap: 8px; }
    .logo { font-size: 1.15rem; white-space: normal; line-height: 1.05; }
    .views button { padding: 5px 6px; }
    header .donate-link { padding: 8px 12px; letter-spacing: .06em; font-size: .7rem; }
  }

  /* Slider */
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .viewport { overflow: hidden; padding: 8px 0; touch-action: pan-y; user-select: none; }
  .track { display: flex; gap: var(--gap); transition: transform .7s cubic-bezier(.22,.8,.25,1); will-change: transform; }
  .slide { flex: 0 0 var(--slide-w); height: var(--slide-h); position: relative; overflow: hidden;
           background: var(--stone); cursor: pointer; opacity: .32; transition: opacity .7s; }
  .slide.current { opacity: 1; cursor: default; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .slide .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 24px 18px;
                background: linear-gradient(to top, rgba(15,14,12,.75), transparent);
                font-size: .78rem; text-transform: uppercase; letter-spacing: .2em; color: var(--bone); }

  /* First slide: the title card */
  .cover { display: grid; place-items: center; text-align: center; }
  .cover::before { content: ""; position: absolute; inset: 0; background: rgba(20,19,17,.42); }
  .cover img { position: absolute; inset: 0; }
  .cover .inner { position: relative; padding: 24px; }
  .cover h1 { font-family: "Cormorant Garamond", serif; font-weight: 500; margin: 0;
              font-size: clamp(2.6rem, 7vw, 5.6rem); line-height: 1; color: #f1ede6; }
  .cover p { margin: 14px 0 26px; font-size: .78rem; text-transform: uppercase; letter-spacing: .26em; color: var(--bone); }
  .cover .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .ghost { background: none; border: 1px solid rgba(213,209,200,.5); padding: 10px 18px; cursor: pointer;
           font-size: .74rem; text-transform: uppercase; letter-spacing: .2em; text-decoration: none; border-radius: 999px; }
  .ghost:hover { border-color: var(--bone); }
  .cover .donate-link { justify-self: auto; }

  /* Progress dots and arrows */
  .nav { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 26px 16px 30px; }
  .arrow { background: none; border: 1px solid rgba(213,209,200,.3); width: 38px; height: 38px; border-radius: 50%;
           cursor: pointer; display: grid; place-items: center; color: var(--mist); }
  .arrow:hover { border-color: var(--bone); color: var(--bone); }
  .dots { display: flex; align-items: center; gap: 0; max-width: 50vw; }
  .dots button { background: none; border: 0; padding: 8px 5px; cursor: pointer; }
  .dots button span { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--ash); opacity: .5;
                      transition: all .3s; }
  .dots button.on span { width: 14px; height: 14px; opacity: 1; background: none; border: 2px solid var(--ember); }
  .count { font-size: .74rem; letter-spacing: .2em; color: var(--mist); min-width: 64px; text-align: center; }

  /* Grid view */
  .grid { display: none; columns: 4 240px; column-gap: 14px; padding: 8px clamp(16px, 4vw, 48px) 48px; }
  .grid figure { margin: 0 0 14px; break-inside: avoid; cursor: zoom-in; overflow: hidden; background: var(--stone); }
  .grid img { width: 100%; height: auto; display: block; transition: transform .5s, opacity .3s; opacity: .85; }
  .grid figure:hover img { transform: scale(1.04); opacity: 1; }
  body.grid-mode .grid { display: block; }
  body.grid-mode .stage { display: none; }

  footer { text-align: center; padding: 0 16px 22px; font-size: .78rem; color: var(--ash); }
  footer a { color: var(--mist); }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>

<div class="page">
  <header>
    <a class="logo" href="./">un toit pour moi</a>
    <div class="views" role="group" aria-label="Affichage">
      <button id="v-grid" aria-label="Vue grille" title="Grille">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg>
      </button>
      <button id="v-slide" class="on" aria-label="Vue diaporama" title="Diaporama">
        <svg width="22" height="16" viewBox="0 0 22 16" fill="currentColor"><rect x="5" y="2" width="12" height="12"/><rect x="0" y="4" width="3" height="8" opacity=".5"/><rect x="19" y="4" width="3" height="8" opacity=".5"/></svg>
      </button>
    </div>
    <a class="donate-link" href="https://www.helloasso.com/associations/un-toit-pour-moi/formulaires/1" target="_blank" rel="noopener">Faire un don</a>
  </header>

  <main class="stage">
    <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
    <nav class="nav">
      <button class="arrow" id="prev" aria-label="Photo précédente">‹</button>
      <div class="dots" id="dots"></div>
      <span class="count" id="count"></span>
      <button class="arrow" id="next" aria-label="Photo suivante">›</button>
    </nav>
  </main>

  <section class="grid" id="grid"></section>

  <footer>
    <a href="https://www.helloasso.com/associations/un-toit-pour-moi" target="_blank" rel="noopener">Découvrir l'association sur HelloAsso</a>
  </footer>
</div>

<script>
const DONATE = "https://www.helloasso.com/associations/un-toit-pour-moi/formulaires/1";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const track = document.getElementById("track");
const dotsEl = document.getElementById("dots");
const backdrop = document.getElementById("backdrop");
let slides = [];   // [{src, caption}] where index 0 is the title card
let current = 0;

fetch("content/photos.json", { cache: "no-cache" })
  .then(r => r.json())
  .catch(() => [])
  .then(build);

function build(photos) {
  photos = (photos || []).filter(p => p.src);
  // The first photo is the backdrop of the title card; the others follow as slides.
  const cover = photos[0];
  slides = [{ cover: true, src: cover?.src }].concat(photos.slice(1));

  track.innerHTML = slides.map((s, i) => s.cover
    ? `<div class="slide cover current" data-i="0">
         ${s.src ? `<img src="${esc(s.src)}" alt="">` : ""}
         <div class="inner">
           <h1>Un toit pour moi</h1>
           <p>La galerie du projet</p>
           <div class="actions">
             <a class="donate-link" href="${DONATE}" target="_blank" rel="noopener">Faire un don</a>
             ${slides.length > 1 ? `<button class="ghost" data-go="1">Voir la galerie</button>` : ""}
           </div>
         </div>
       </div>`
    : `<div class="slide" data-i="${i}">
         <img src="${esc(s.src)}" alt="${esc(s.caption)}" ${i > 2 ? 'loading="lazy"' : ""}>
         ${s.caption ? `<div class="cap">${esc(s.caption)}</div>` : ""}
       </div>`).join("");

  dotsEl.innerHTML = slides.map((_, i) => `<button data-i="${i}" aria-label="Photo ${i + 1}"><span></span></button>`).join("");

  document.getElementById("grid").innerHTML = photos.map((p, i) =>
    `<figure data-i="${i}"><img src="${esc(p.src)}" alt="${esc(p.caption)}" loading="lazy"
       ${p.w ? `width="${p.w}" height="${p.h}"` : ""}></figure>`).join("");

  document.querySelector(".nav").style.visibility = slides.length > 1 ? "" : "hidden";
  go(0);
}

function go(i) {
  current = Math.max(0, Math.min(slides.length - 1, i));
  const el = track.children[current];
  if (!el) return;
  // Centre the current slide inside the viewport.
  const offset = el.offsetLeft - (track.parentElement.clientWidth - el.offsetWidth) / 2;
  track.style.transform = `translateX(${-offset}px)`;
  [...track.children].forEach((s, n) => s.classList.toggle("current", n === current));
  [...dotsEl.children].forEach((d, n) => d.classList.toggle("on", n === current));
  document.getElementById("count").textContent =
    String(current + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
  const src = slides[current].src;
  backdrop.style.backgroundImage = src ? `url("${src}")` : "";
}

track.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) return go(+b.dataset.go);
  const s = e.target.closest(".slide");
  if (s && +s.dataset.i !== current) go(+s.dataset.i);
});
dotsEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
document.getElementById("prev").onclick = () => go(current - 1);
document.getElementById("next").onclick = () => go(current + 1);
document.addEventListener("keydown", e => {
  if (document.body.classList.contains("grid-mode")) return;
  if (e.key === "ArrowLeft") go(current - 1);
  if (e.key === "ArrowRight") go(current + 1);
});
window.addEventListener("resize", () => go(current));

// Swipe on phones
let x0 = null;
const vp = document.getElementById("viewport");
vp.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
vp.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 40) go(current + (dx < 0 ? 1 : -1));
  x0 = null;
});

// Grid / slider toggle
const setMode = grid => {
  document.body.classList.toggle("grid-mode", grid);
  document.getElementById("v-grid").classList.toggle("on", grid);
  document.getElementById("v-slide").classList.toggle("on", !grid);
  if (!grid) requestAnimationFrame(() => go(current));
};
document.getElementById("v-grid").onclick = () => setMode(true);
document.getElementById("v-slide").onclick = () => setMode(false);
document.getElementById("grid").addEventListener("click", e => {
  const f = e.target.closest("figure");
  if (!f) return;
  current = +f.dataset.i;   // photo i is slide i (photo 0 is the title card)
  setMode(false);
});
</script>
</body>
</html>
